@if (toast$ | async; as toast) {
  <div
    class="toast"
    [ngClass]="[toast.type, toast.position]"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
    (click)="onClick()"
  >
    <span>{{ toast.message }}</span>
    <div class="progress">
      <div
        class="progress-bar"
        [style.--duracao]="toast.timeOut + 'ms'"
        [style.animation-play-state]="pausado ? 'paused' : 'running'"
      ></div>
    </div>
  </div>
}
