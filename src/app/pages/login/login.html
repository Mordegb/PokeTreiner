<body>
  <div class="container">
    <div class="form-box-login">
      <form>
        <h1>login</h1>
        <div class="input-camp">
          <input type="email" placeholder="Diga seu email" />
          <img src="envelope.svg" class="bx bxs-email" />
        </div>
        <div class="input-camp">
          <input type="password" placeholder="diga sua senha" />
          <img src="car-key.svg" class="bx bxs-key-alt" />
        </div>
        <div class="forgot-link">
          <a href="#">Esqueci minha senha</a>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <div class="form-box-register">
      <form>
        <h1>Registre-se</h1>
        <div class="input-camp">
          <input type="text" placeholder="nome de usuario" />
          <img src="userIcon.svg" />
        </div>

        <div class="input-camp">
          <input type="email" placeholder="Email" />
          <img src="envelope.svg" class="bx bxs-email" />
        </div>

        <div class="input-camp">
          <input type="password" placeholder="diga sua senha" />
          <img src="lock.svg" class="bx bxs-lock-alt" />
        </div>
      </form>
    </div>

    <div class="toggle-box">
      <div class="toggle-painel toggle-left">
        <!--//onde vou botar a pokedex -->
        <h1>Hello Welcome</h1>
        <p>não tem uma conta? Registri-se!</p>
        <button class="bnt register-bnt">criar conta</button>
      </div>

      <div class="toggle-painel toggle-right">
        <!--//onde vou botar os pivete -->
        <h1>Hello nice to meet you</h1>
        <p>Já! tem uma conta?, entre nela!</p>
        <button class="bnt register-bnt">Entrar</button>
      </div>
    </div>
  </div>
  <!--//container -->
</body>
