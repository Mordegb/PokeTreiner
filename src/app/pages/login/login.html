<body>
  <div class="container">
    <div class="left-side">
      <button (click)="IrCriar()">Registar</button>
    </div>
    <div class="rigth-side">
      <form [formGroup]="LoginForm" (ngSubmit)="FazerLogin()">
        <div class="login">
          <div class="login-img-wrapper">
            <img src="PokeLogin.png" />
            <h4 (click)="HowIsThatPokemon()" class="segredo">O</h4>
          </div>
        </div>
        <div [className]="loginSuceful ? 'InputTrue' : 'InputFalse'">
          <input type="email" placeholder=" " formControlName="UserEmail" (input)="limparErro()" />
          <label>Email</label>
          <img src="envelope.svg" class="inputImg" />
        </div>

        <div [className]="loginSuceful ? 'InputTrue' : 'InputFalse'">
          <input
            [type]="InputPassword"
            placeholder=" "
            formControlName="UserPassword"
            (input)="limparErro()"
          />
          <label>Senha</label>
          <img src="car-key.svg" class="inputImg" />
        </div>

        <div class="forgot-link">
          <input type="checkbox" name="Showpassword" (click)="ShowPassword()" />
          <label for="Showpassword"> Show Password</label>
          <a href="#">Forgot the password! </a>
        </div>
        <button
          type="submit"
          [className]="LoginForm.valid ? 'bntTrue' : 'bntFalse'"
          [disabled]="LoginForm.invalid"
        >
          Login
        </button>
      </form>
    </div>
  </div>
</body>
