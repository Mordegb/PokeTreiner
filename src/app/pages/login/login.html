<body>
  <div class="container">
    <div class="left-side"></div>
    <div class="rigth-side">
      <form>
        <div class="login">
          <img src="PokeLogin.png" (click)="HowIsThatPokemon()" />
        </div>
        <div class="InputTrue">
          <input type="email" placeholder=" " />
          <label>Email</label>
          <img src="envelope.svg" class="inputImg" />
        </div>

        <div class="InputTrue">
          <input [type]="InputPassword" placeholder=" " />
          <label>Senha</label>
          <img src="car-key.svg" class="inputImg" />
        </div>

        <div class="forgot-link">
          <input type="checkbox" name="Showpassword" (click)="ShowPassword()" />
          <label for="Showpassword"> Show Password</label>
          <a href="#">Forgot the password! </a>
        </div>
        <button type="submit" class="bnt">Login</button>
      </form>
    </div>
  </div>
</body>
